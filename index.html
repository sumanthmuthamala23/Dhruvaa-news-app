<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DHRUVAA News • ధ్రువ న్యూస్</title>

  <!-- iOS Full-Screen App Mode & Home Screen Icon -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DHRUVAA News" />
  <link rel="apple-touch-icon" href="DHRUVAA.jpg" />

  <!-- Android Full-Screen App Mode & Theme Color -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="icon" type="image/jpeg" href="DHRUVAA.jpg" />
  <link rel="manifest" href="manifest.json" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #b91c1c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash-screen img {
      width: 92px;
      height: 92px;
      border-radius: 20px;
      object-fit: cover;
      background: #ffffff;
      padding: 4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 16px;
    }
    #splash-screen h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    #splash-screen p {
      font-size: 13px;
      color: #fde68a;
      margin-top: 4px;
      font-weight: 600;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Native Mobile Splash Screen while app loads -->
  <div id="splash-screen">
    <img src="DHRUVAA.jpg" alt="DHRUVAA News" onerror="this.style.display='none'" />
    <h1>DHRUVAA NEWS</h1>
    <p>ధ్రువ న్యూస్ • Loading Live Feed...</p>
  </div>

  <!-- Full-Screen Embedded Streamlit App -->
  <iframe
    id="app-frame"
    src="https://dhruvaa-news.streamlit.app/?embed=true"
    allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
    onload="setTimeout(() => { const s = document.getElementById('splash-screen'); if(s){ s.style.opacity='0'; setTimeout(()=>s.remove(), 400); } }, 800);">
  </iframe>

  <!-- Service Worker Registration for PWABuilder & Offline App Readiness -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
